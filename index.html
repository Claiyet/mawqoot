<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقوت – أوقات الصلاة</title>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* colors */
    :root {
      --cream: #f3eee3;
      --beige: #e6dfcf;
      --green: #143d30;
      --sand: #c9a86a;
      --gray: #827c70;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Thmanyah Sans", Tahoma, sans-serif;
      background: var(--cream);
      color: #1b1a17;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    /* top bar */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    /* heading font */
    .logo, .next-text span {
      font-family: "Reem Kufi", sans-serif;
    }

    .logo {
      font-size: 34px;
      font-weight: 700;
      color: var(--green);
    }

    select, button {
      font-family: inherit;
      font-size: 15px;
      padding: 10px 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    select {
      background: white;
    }

    button {
      background: var(--green);
      color: var(--cream);
    }

    /* green box */
    .main-box {
      background: var(--green);
      color: var(--cream);
      border-radius: 28px;
      padding: 35px 40px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      opacity: 0.8;
    }

    .next-text {
      font-size: 20px;
      margin-top: 30px;
    }

    .next-text span {
      color: var(--sand);
      font-weight: bold;
    }

    .countdown {
      font-size: 110px;
      font-weight: bold;
      direction: ltr;
      text-align: right;
    }

    .bar {
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      margin-top: 25px;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      background: var(--sand);
      border-radius: 6px;
    }

    .bar-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.75;
    }

    /* prayer cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
    }

    .card-name {
      color: var(--gray);
    }

    .card-time {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }

    .card.passed {
      background: var(--beige);
      color: var(--gray);
    }

    .card.next {
      background: var(--sand);
      color: var(--green);
    }

    #message {
      margin-top: 15px;
      color: var(--green);
    }

    /* phones */
    @media (max-width: 700px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
      .countdown {
        font-size: 60px;
        text-align: center;
      }
      .info {
        flex-direction: column;
        gap: 5px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="topbar">
      <div class="logo">موقوت</div>
      <div>
        <select id="city">
          <option value="Riyadh">الرياض</option>
          <option value="Makkah">مكة المكرمة</option>
          <option value="Madinah">المدينة المنورة</option>
          <option value="Jeddah">جدة</option>
          <option value="Dammam">الدمام</option>
          <option value="Abha">أبها</option>
          <option value="Tabuk">تبوك</option>
          <option value="Hail">حائل</option>
          <option value="Buraydah">بريدة</option>
          <option value="Jazan">جازان</option>
        </select>
        <button id="locationBtn">موقعي</button>
      </div>
    </div>

    <div class="main-box">
      <div class="info">
        <span id="place"></span>
        <span id="date"></span>
      </div>

      <p class="next-text">باقي على صلاة <span id="nextName"></span></p>
      <div class="countdown" id="countdown">--:--:--</div>

      <div class="bar">
        <div class="bar-fill" id="barFill"></div>
      </div>
      <div class="bar-labels">
        <span id="prevLabel"></span>
        <span id="nextLabel"></span>
      </div>
    </div>

    <div class="cards" id="cards"></div>

    <p id="message"></p>
  </div>

  <script>
    let times = null;   // prayer times from the API
    let timer = null;   // the countdown timer

    const prayers = [
      { key: "Fajr", name: "الفجر" },
      { key: "Dhuhr", name: "الظهر" },
      { key: "Asr", name: "العصر" },
      { key: "Maghrib", name: "المغرب" },
      { key: "Isha", name: "العشاء" }
    ];

    const citySelect = document.getElementById("city");
    const locationBtn = document.getElementById("locationBtn");
    const message = document.getElementById("message");


    // get the times from the API and show them
    async function getTimes(url, placeName) {
      message.textContent = "جاري التحميل...";

      try {
        const response = await fetch(url);
        const data = await response.json();

        times = data.data.timings;
        const hijri = data.data.date.hijri;
        const gregorian = data.data.date.gregorian;

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
                        "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        const gregorianMonth = months[gregorian.month.number - 1];

        document.getElementById("place").textContent = placeName;
        document.getElementById("date").textContent =
          hijri.weekday.ar + " " + hijri.day + " " + hijri.month.ar + " " + hijri.year + " هـ" +
          "  ·  " + Number(gregorian.day) + " " + gregorianMonth + " " + gregorian.year + " م";

        showCards();
        startTimer();
        message.textContent = "";
      } catch (error) {
        message.textContent = "صار خطأ، تأكد من الإنترنت";
      }
    }


    // when the user picks a city
    function loadCity() {
      const city = citySelect.value;
      const cityName = citySelect.options[citySelect.selectedIndex].text;
      const url = "https://api.aladhan.com/v1/timingsByCity?city=" + city + "&country=Saudi Arabia&method=4";

      getTimes(url, cityName);
      localStorage.setItem("city", city);
    }


    // when the user clicks "my location"
    function loadMyLocation() {
      message.textContent = "جاري تحديد موقعك...";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const url = "https://api.aladhan.com/v1/timings?latitude=" + lat + "&longitude=" + lon + "&method=4";
          getTimes(url, "موقعك الحالي");
        },
        function () {
          message.textContent = "ما تم السماح بالموقع، اختر مدينتك من القائمة";
        }
      );
    }


    // turns "17:04" into a Date for today
    function toDate(time) {
      const hours = Number(time.slice(0, 2));
      const minutes = Number(time.slice(3, 5));

      const date = new Date();
      date.setHours(hours, minutes, 0, 0);
      return date;
    }


    // turns "17:04" into "5:04 م"
    function to12Hour(time) {
      let hours = Number(time.slice(0, 2));
      const minutes = time.slice(3, 5);
      let period = "ص";

      if (hours >= 12) period = "م";
      if (hours > 12) hours = hours - 12;
      if (hours === 0) hours = 12;

      return hours + ":" + minutes + " " + period;
    }


    // adds a zero before single numbers: 5 → "05"
    function twoDigits(number) {
      if (number < 10) return "0" + number;
      return number;
    }


    // draws the 5 prayer cards
    function showCards() {
      let html = "";

      for (let i = 0; i < prayers.length; i++) {
        html += '<div class="card" id="' + prayers[i].key + '">';
        html += '<div class="card-name">' + prayers[i].name + "</div>";
        html += '<div class="card-time">' + to12Hour(times[prayers[i].key]) + "</div>";
        html += "</div>";
      }

      document.getElementById("cards").innerHTML = html;
    }


    // finds which prayer is next, and which one was before it
    function findNextPrayer() {
      const now = new Date();

      for (let i = 0; i < prayers.length; i++) {
        const prayerTime = toDate(times[prayers[i].key]);

        if (prayerTime > now) {
          // before fajr → the previous one is yesterday's isha
          if (i === 0) {
            const yesterdayIsha = toDate(times.Isha);
            yesterdayIsha.setDate(yesterdayIsha.getDate() - 1);
            return { index: 0, time: prayerTime, prevTime: yesterdayIsha, prevName: "العشاء" };
          }

          return {
            index: i,
            time: prayerTime,
            prevTime: toDate(times[prayers[i - 1].key]),
            prevName: prayers[i - 1].name
          };
        }
      }

      // after isha → next is tomorrow's fajr
      const tomorrowFajr = toDate(times.Fajr);
      tomorrowFajr.setDate(tomorrowFajr.getDate() + 1);
      return { index: 0, time: tomorrowFajr, prevTime: toDate(times.Isha), prevName: "العشاء", tomorrow: true };
    }


    // runs every second
    function update() {
      const now = new Date();
      const next = findNextPrayer();
      const nextName = prayers[next.index].name;

      // countdown
      const secondsLeft = Math.floor((next.time - now) / 1000);
      const h = Math.floor(secondsLeft / 3600);
      const m = Math.floor((secondsLeft % 3600) / 60);
      const s = secondsLeft % 60;

      document.getElementById("nextName").textContent = nextName;
      document.getElementById("countdown").textContent = twoDigits(h) + ":" + twoDigits(m) + ":" + twoDigits(s);

      // progress bar
      const percent = (now - next.prevTime) / (next.time - next.prevTime) * 100;
      document.getElementById("barFill").style.width = percent + "%";
      document.getElementById("prevLabel").textContent = next.prevName;
      document.getElementById("nextLabel").textContent = nextName;

      // card colors
      for (let i = 0; i < prayers.length; i++) {
        const card = document.getElementById(prayers[i].key);
        card.className = "card";

        if (i === next.index) {
          card.className = "card next";
        } else if (next.tomorrow || i < next.index) {
          card.className = "card passed";
        }
      }
    }


    function startTimer() {
      clearInterval(timer);   // stop the old timer first
      update();
      timer = setInterval(update, 1000);
    }


    // start
    citySelect.addEventListener("change", loadCity);
    locationBtn.addEventListener("click", loadMyLocation);

    if (localStorage.getItem("city")) {
      citySelect.value = localStorage.getItem("city");
    }
    loadCity();
  </script>
</body>
</html>
